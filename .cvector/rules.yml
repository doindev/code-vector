# cvector architecture rules.
# Tune thresholds below; disable built-in rules by name in `disable`.
# Define project-specific rules under `custom` using Cypher.

thresholds:
  # Visitor-pattern parsers naturally have many small methods, so we keep the threshold
  # relaxed for files/classes; long-method still catches the truly painful cases.
  godFileMethods: 40
  godClassMethods: 40
  longMethodLines: 80
  deepInheritance: 5

disable: []
#  - long-method
#  - dead-code

# Skip vendored ANTLR grammar code and generated sources.
excludePaths:
  - /internal/
  - /target/
  - /generated-sources/

