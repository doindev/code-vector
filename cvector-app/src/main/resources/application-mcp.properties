spring.main.banner-mode=off
spring.main.log-startup-info=false

# SSE connections live indefinitely. Spring MVC's default async-request timeout
# (30 s) kills the SSE stream the moment no event flows for half a minute, which
# in turn causes Spring AI's WebMvcSseServerTransportProvider to evict the MCP
# session from its in-memory map. The next client POST to /mcp?sessionId=… then
# returns "Session not found" from handleMessage:311 (HTTP 404) — exactly the
# failure pattern observed by external MCP agents that hold a session open for
# many seconds between calls.
#
# -1 disables the timeout entirely (recommended for SSE). If you'd rather cap
# session lifetime, set it to a large multi-hour value in milliseconds.
spring.mvc.async.request-timeout=-1

# Tomcat keep-alive timeout — gives the underlying TCP socket headroom on
# long-lived SSE streams. Spring's async timeout is the more important knob,
# but a too-short keepalive can still tear connections down. 10 min is enough
# for any realistic idle MCP client.
server.tomcat.keep-alive-timeout=600000
server.tomcat.connection-timeout=600000

# Virtual threads disabled on the MCP profile in 0.2.0.
#
# Spring AI's WebMvcSseServerTransportProvider.handleMessage does:
#   session.handle(message).block();
# That `block()` synchronously waits for the SSE-side response write to complete.
# When the MCP response is large (cv_list_projects with rich metadata, cv_onboard
# with a full briefing, cv_wiki, cv_search with many hits), the SSE write may fill
# Tomcat's NIO socket buffer faster than the kernel TCP buffer drains. On platform
# threads that just means the write blocks for a few ms until the buffer flushes —
# but on virtual threads, the same blocking-write PINS the carrier thread (JDK 21
# can't unmount a virtual thread mid-NIO-write), starving all other virtual
# threads that share the carrier. The visible failure mode is the one external MCP
# agents reported: silent timeouts on every POST to /mcp + session-eviction 404s.
#
# Falling back to platform threads costs us a tiny per-request scheduling overhead
# but eliminates the pinning hazard. The Tomcat default thread pool (200) is more
# than enough headroom for typical IDE-agent traffic patterns.
spring.threads.virtual.enabled=false

# Client handshake gotcha: Spring AI's McpServerSession.handleIncomingRequest gates every
# non-initialize tool call on `exchangeSink.asMono()`, and that sink only emits after the
# client POSTs a `notifications/initialized` notification (per the MCP spec). If you write a
# bespoke MCP client and forget that step, every tool call hangs forever inside the active
# transport's `handleMessage` — looks like a transport bug but is actually a missing
# initialized notification. Real MCP clients (Claude, Cursor, MCP Inspector, Eclipse Copilot)
# send it automatically; ad-hoc curl/PowerShell smoke scripts must too.
#
# Transport selection in 0.2.x (Spring AI 2.0):
#   - `cvector serve` (plain stdio) keeps spring.ai.mcp.server.stdio=true (this file's default).
#   - `cvector dashboard` overrides stdio=false in CvectorApplication, and sets
#     spring.ai.mcp.server.protocol=STREAMABLE (or SSE if settings.json's mcp.transport=sse).
#     Spring AI's auto-config wires the matching WebMvc transport provider; the others stay
#     inert. See {@link io.doindev.cvector.CvectorApplication} for the coHostMcp branch.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=cvector
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=SYNC

logging.file.name=${user.home}/.cvector/mcp-server.log
logging.level.root=OFF
logging.level.io.doindev.cvector=INFO
logging.level.org.springframework.ai=INFO
