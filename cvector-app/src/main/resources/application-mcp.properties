spring.main.banner-mode=off
spring.main.log-startup-info=false

# Virtual threads make each MCP tool invocation a near-zero-cost concurrent context. Ignored on JDK <21.
spring.threads.virtual.enabled=true

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=cvector
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=SYNC

logging.file.name=${user.home}/.cvector/mcp-server.log
logging.level.root=OFF
logging.level.io.doindev.cvector=INFO
logging.level.org.springframework.ai=INFO
