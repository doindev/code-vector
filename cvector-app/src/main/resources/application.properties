spring.main.banner-mode=off
spring.main.log-startup-info=false

# Lazy bean construction — defer all bean creation until first injection. The 28 parser
# adapters never instantiate for read-only commands (status, search, explain, recent, doctor,
# etc.); scan/diff/watch pay the same total cost but later in the call. Verified zero
# @PostConstruct usage across the cvector modules, so nothing depends on eager init.
spring.main.lazy-initialization=true

spring.ai.mcp.server.enabled=false

# Bind the embedded web server (dashboard / REST API) to loopback only. Prevents
# cvector from accepting requests from other hosts on the network -- callers must
# come from 127.0.0.1 / ::1. Override with `--server.address=0.0.0.0` if you really
# need to expose it.
server.address=127.0.0.1

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.neo4j=WARN
logging.level.io.doindev.cvector=INFO
logging.pattern.console=%msg%n
