<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cvector dashboard</title>
  <base href="/dashboard/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a1a">
  <!-- favicon lives under assets/ because angular.json's default `assets` config maps
       src/assets/** → <bundle>/assets/**. Relative to <base href="/dashboard/"> the
       browser resolves this to /dashboard/assets/favicon.ico, which DashboardConfiguration
       serves from classpath:/static/dashboard/browser/assets/favicon.ico. -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
  <cv-root>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;color:#888">
      Loading cvector dashboard&hellip;
    </div>
  </cv-root>
</body>
</html>
