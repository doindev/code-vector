# cvector + Neo4j stack.
#
# Common workflows:
#
#   # one-shot scan of the host project mounted at /workspace
#   docker compose run --rm cvector scan
#
#   # interactive dashboard on http://localhost:2969
#   docker compose up -d neo4j dashboard
#
#   # MCP server over stdio (use this as the command in your MCP client config)
#   docker compose run --rm -T cvector serve
#
# The `cvector` service is intended for ad-hoc commands; `dashboard` runs the
# REST API as a long-lived process.

services:
  neo4j:
    image: neo4j:5
    container_name: cvector-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/cvector_admin_pw}"
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 512m
    volumes:
      - cvector_neo4j_data:/data
      - cvector_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Ad-hoc cvector commands. Override with `docker compose run --rm cvector <cmd>`.
  # Mounts the current directory as /workspace so `scan` sees the host project.
  cvector:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvector:local
    container_name: cvector-cli
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # cvector reads .cvector/project.json at startup; override the Neo4j
      # connection here so the in-container config doesn't need editing.
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Djava.net.preferIPv4Stack=true"
      cvector_role: "${CVECTOR_ROLE:-dev}"
    volumes:
      - ./:/workspace:rw
    working_dir: /workspace
    # No restart — this is for one-shot commands.
    profiles: ["cli"]

  # Long-lived REST API on port 2969.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvector:local
    container_name: cvector-dashboard
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Djava.net.preferIPv4Stack=true"
      cvector_role: "${CVECTOR_ROLE:-dev}"
    ports:
      - "2969:2969"
    volumes:
      - ./:/workspace:ro
    working_dir: /workspace
    command: ["dashboard"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2969/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cvector_neo4j_data:
  cvector_neo4j_logs:
